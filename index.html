<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pixel Clicker</title>
        <link rel="stylesheet" href="assets/css/main.css" />
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="counter" id="counter">0</div>
                <button class="settings-btn" id="settingsBtn">
                    <svg
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path
                            d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.91,11.36,4.89,11.69,4.89,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"
                        />
                    </svg>
                </button>
            </div>
            <div class="click-area">
                <img
                    src="assets/images/p6.png"
                    alt="Click me"
                    class="click-image"
                    id="clickImage"
                />
            </div>
        </div>

        <!-- Popup настроек -->
        <div class="settings-popup" id="settingsPopup">
            <div class="popup-content">
                <div class="popup-header">
                    <h2>Настройки</h2>
                    <button class="close-btn" id="closePopup">×</button>
                </div>
                <div class="settings-content">
                    <div class="setting-group">
                        <h3>Внешний вид</h3>
                        <div class="setting-item">
                            <label class="switch">
                                <input type="checkbox" id="darkThemeToggle" />
                                <span class="slider"></span>
                            </label>
                            <span class="setting-label">Тёмная тема</span>
                        </div>

                        <div class="setting-item">
                            <label class="setting-label"
                                >Изображение для клика:</label
                            >
                            <div class="image-selector">
                                <div class="image-option" data-image="p6.png">
                                    <img
                                        src="assets/images/p6.png"
                                        alt="Pixel 6"
                                    />
                                    <span>Pixel 6</span>
                                </div>
                                <div class="image-option" data-image="esha.jpg">
                                    <img
                                        src="assets/images/esha.jpg"
                                        alt="Esha"
                                    />
                                    <span>Esha</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="setting-group">
                        <h3>Действия</h3>
                        <button class="danger-btn" id="resetData">
                            Сбросить всё
                        </button>
                    </div>

                    <div class="setting-group">
                        <h3>Ссылки</h3>
                        <a
                            href="https://afagp.store"
                            target="_blank"
                            class="link-btn"
                        >
                            AFGAN Store
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <script src="assets/js/clicker.js"></script>
        <script src="assets/js/settings.js"></script>
    </body>
</html>
